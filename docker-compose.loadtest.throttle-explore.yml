# Third, separate override -- ONLY for exploratory RC Area 6 runs that
# deliberately raise THROTTLE_RATE_MPESA_CALLBACK to see the capacity
# layer beneath the real 120/min-per-source-IP throttle (see
# docs/rc/BACKEND_RC.md Area 6, 5E-1's "as-configured" finding). Kept
# separate from docker-compose.loadtest.yml so the standard load-test
# overlay still reflects the real, deployed throttle default -- an
# exploratory run must be launched explicitly with this extra file, never
# silently included, so its results are never confused with an
# as-configured measurement.
#
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.loadtest.yml \
#     -f docker-compose.loadtest.throttle-explore.yml up -d backend
services:
  backend:
    environment:
      THROTTLE_RATE_MPESA_CALLBACK: "100000/min"
