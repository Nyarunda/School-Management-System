# Override for Milestone 5E load-test runs -- NOT used for normal dev.
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up --build
#
# Swaps the dev server for a real WSGI server (gunicorn) and gives the
# Celery worker an explicit, reproducible concurrency, since the default
# docker-compose.yml's `manage.py runserver` is meaningless for a capacity
# number. See docs/architecture/load-testing.md for the full runbook.
services:
  backend:
    build: ./backend
    # `exec` before the final command matters here for the same reason as
    # the Dockerfile's own gunicorn CMD (see its comment): without it, this
    # `sh -c` wrapper -- not gunicorn -- is PID 1, so `docker stop`/`restart`'s
    # SIGTERM never reaches gunicorn and every shutdown silently degrades to
    # the hard SIGKILL timeout instead of a graceful one. Found live during
    # RC Area 7 Check 4 (`docker top` showed `sh -c ...` as PID 1, celery as
    # a child) before it could quietly invalidate a graceful-shutdown check.
    command: sh -c "pip install -r requirements/loadtest.txt && exec gunicorn config.wsgi:application --workers 4 --threads 2 --bind 0.0.0.0:8000"
    environment:
      MPESA_SANDBOX_BASE_URL: "http://fake-daraja:9999"
      # RC Area 6 defect fix: without this, DRF throttle counters use
      # Django's default per-process cache, and gunicorn's 4 worker
      # processes above each get an independent counter -- silently
      # multiplying every throttle ceiling by however many workers happen
      # to receive traffic. DB 1, distinct from Celery's broker on DB 0.
      DJANGO_CACHE_URL: "redis://redis:6379/1"
      # The real 5/min-per-IP default (RC Area 2) is a deliberate brute-force
      # control -- correct for production, but every one of the harness's
      # ~20 tenants logs in once from the same client IP (the harness
      # process), which isn't the capacity dimension Area 6 measures. Same
      # spirit as the worker/thread overrides below: tune the load-test
      # environment around a control that isn't under test here, don't
      # touch the production default in config/settings.py.
      THROTTLE_RATE_LOGIN: "1000/min"

  celery-worker:
    # See the `backend` command above -- same `exec` fix, same reason.
    command: sh -c "pip install -r requirements/loadtest.txt && exec celery -A config worker --loglevel=info --concurrency=4"
    environment:
      MPESA_SANDBOX_BASE_URL: "http://fake-daraja:9999"

  celery-beat:
    environment:
      MPESA_SANDBOX_BASE_URL: "http://fake-daraja:9999"

  fake-daraja:
    build: ./backend
    command: python -m loadtest.fake_daraja
    working_dir: /app
    ports:
      - "9999:9999"
