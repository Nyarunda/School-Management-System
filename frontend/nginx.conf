server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Docker's embedded DNS (127.0.0.11) + a short TTL + a variable in
    # proxy_pass forces nginx to re-resolve `backend` on this schedule
    # instead of caching its IP for the container's whole lifetime. Without
    # this, any backend redeploy/recreate (a new container gets a new IP)
    # leaves nginx silently sending every proxied API request to a dead IP
    # -- 502s until nginx itself is restarted. Found live in RC Area 7.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
